<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        var subjectObject = {
            "Koppal": {
                "Gangavathi": ["GV1", "GV2", "GV3", "GV4"],
                "Koppal": ["Koppala", "Ginageri", "Bassapura", "Kidadala", "Hanumanahalli", "Kutaganahalli", "Gabbura", "Lingadalli", "Shahapura", "Rudrapura", "Kanakapura", "Allanagara", "Madinura", "Naregalla", "Kolura", "Mangalapura", "Gunnalli", "Horatattannala", "Dadegalla", "Yatnatti", "Ojanalli", "Chilavadgi", "Devalapura", "Kalakeri", "Hatti"],
                "Yelburga": ["YV1", "YV2", "YV3", "YV4"],
                "Kushtagi": ["KV1", "KV2"],
                "Kanakagiri": ["KV1", "KV2"],
                "Karatagi": ["KV1", "KV2"],
                "Kuknoor": ["KV1", "KV2"]
            },
            "Bellary": {
                "Bellary": ["BV1", "BV2"],
                "Siruguppa": ["SV1", "SV2"],
                "Hospet": ["HV1", "HV2"],
                "Kudligi": ["KV1", "KV2"],
                "Sandur": ["SV1", "SV2"],
                "Hadagali": ["HV1", "HV2"],
                "Hagaribommanahalli": ["HV1", "HV2"]
            },
            "Vijayanagara": {
                "Kudligi": ["KV1", "KV2"],
                "Hospet": ["HV1", "HV2"],
                "Hagaribommanahalli": ["HV1", "HV2"],
                "Huvina Hadagali": ["HV1", "HV2"],
                "Harapanahalli": ["HV1", "HV2"],
                "Kottur": ["KV1", "KV2"]
            }
        }
        window.onload = function () {
            var subjectSel = document.getElementById("subject");
            var topicSel = document.getElementById("topic");
            var chapterSel = document.getElementById("chapter");
            for (var x in subjectObject) {
                subjectSel.options[subjectSel.options.length] = new Option(x, x);
            }
            subjectSel.onchange = function () {
                //empty Chapters- and Topics- dropdowns
                chapterSel.length = 1;
                topicSel.length = 1;
                //display correct values
                for (var y in subjectObject[this.value]) {
                    topicSel.options[topicSel.options.length] = new Option(y, y);
                }
            }
            topicSel.onchange = function () {
                //empty Chapters dropdown
                chapterSel.length = 1;
                //display correct values
                var z = subjectObject[subjectSel.value][this.value];
                for (var i = 0; i < z.length; i++) {
                    chapterSel.options[chapterSel.options.length] = new Option(z[i], z[i]);
                }
            }
        }
    </script>
</head>
<body>
    <br />
    <div class="col-md-3 col-lg-3">
        <label class="font-weight-bold" for="district">District :</label>
        <select name="subject" id="subject">
            <option value="" selected="selected">Select District</option>
        </select>
    </div>
    <div class="col-md-3 col-lg-5">
        <label class="font-weight-bold" for="district">District :</label>
        <select name="topic" id="topic">
            <option value="" selected="selected">Please select district first</option>
        </select>
    </div>
    <div class="col-md-4 col-lg-4">
        <label class="font-weight-bold" for="district">District :</label>
        <select name="chapter" id="chapter">
            <option value="" selected="selected">Please select taluk first</option>
        </select>
    </div>
</body>
